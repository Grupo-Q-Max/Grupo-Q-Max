          unzip -l site.zip | grep ".deployment"
          unzip -l site.zip | grep "runner.js"
          unzip -l site.zip | grep "eventos-api/dist/src/main.js"
          unzip -l site.zip | grep "eventos-web/apps/web/server.js"
          unzip -l site.zip | grep "proposta/server.js"
          unzip -l site.zip | grep "qmax-quiz/index.php"
          unzip -l site.zip | grep "bin/php"

          echo ""
          echo "PACOTE VALIDADO COM SUCESSO."
          ls -lh site.zip

      - name: Diagnostico das credenciais
        shell: pwsh
        run: |
          $user = $env:PUBLISH_USER
          $pass = $env:PUBLISH_PASS

          if ([string]::IsNullOrWhiteSpace($user)) {
              throw "PUBLISH_USER vazio."
          }

          if ([string]::IsNullOrWhiteSpace($pass)) {
              throw "PUBLISH_PASS vazio."
          }

          Write-Host "PUBLISH_USER carregado."
          Write-Host "Tamanho USER: $($user.Length)"
          Write-Host "Tamanho PASS: $($pass.Length)"

          if ($user -eq '$webbd01-app') {
              Write-Host "USER EXATO: OK"
          }
          else {
              throw "PUBLISH_USER inesperado."
          }

      - name: Deploy Azure App Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:PUBLISH_USER
          $password = $env:PUBLISH_PASS
          $kuduBase = $env:KUDU_URL
          $zipPath = "site.zip"

          if (!(Test-Path $zipPath)) {
              throw "site.zip nao encontrado."
          }

          $pair = "${username}:${password}"

          $base64 = [Convert]::ToBase64String(
              [Text.Encoding]::ASCII.GetBytes($pair)
          )

          $headers = @{
              Authorization = "Basic $base64"
          }

          Write-Host "Configurando Kudu Settings para desativar Oryx build na nuvem..."
          try {
              $kuduSettingsUrl = "$kuduBase/api/settings"
              $settingsPayload = @{
                  SCM_DO_BUILD_DURING_DEPLOYMENT = "false"
                  ENABLE_ORYX_BUILD = "false"
              } | ConvertTo-Json
              Invoke-RestMethod -Uri $kuduSettingsUrl -Method Post -Headers $headers -Body $settingsPayload -ContentType "application/json" -TimeoutSec 30
              Write-Host "Kudu settings atualizadas com sucesso: SCM_DO_BUILD_DURING_DEPLOYMENT=false e ENABLE_ORYX_BUILD=false"
          } catch {
              Write-Host "Aviso ao atualizar Kudu settings: $($_.Exception.Message)"
          }

          # Async: O endpoint oficial do Kudu para deploy assincrono via ZIP e /api/zipdeploy?isAsync=true.
          # Ele aceita o upload do ZIP e retorna HTTP 202 imediatamente com o header Location para acompanhamento,
          # evitando qualquer timeout (504 GatewayTimeout) do proxy do Azure App Service.
          $url = "$kuduBase/api/zipdeploy?isAsync=true"

          Write-Host "Publicando Grupo Q-Max via Kudu ZipDeploy (async)..."

          $response = Invoke-WebRequest `
              -Uri $url `
              -Method Post `
              -Headers $headers `
              -InFile $zipPath `
              -ContentType "application/zip" `
              -UseBasicParsing `
              -TimeoutSec 900

          Write-Host "Status HTTP inicial: $($response.StatusCode)"

          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
              throw "Deploy falhou com HTTP $($response.StatusCode)"
          }

          # Acompanhar o deploy assincrono pelo endpoint de status
          # Kudu DeployStatus: 0 = Pending, 1 = Building, 2 = Deploying, 3 = Failed, 4 = Success
          $statusUrl = "$($response.Headers.Location)"
          if ([string]::IsNullOrWhiteSpace($statusUrl)) {
              $statusUrl = "$kuduBase/api/deployments/latest"
          } elseif (-not $statusUrl.StartsWith("http")) {
              $statusUrl = "$kuduBase$statusUrl"
          }
          Write-Host "URL de monitoramento do deploy: $statusUrl"

          $deadline = (Get-Date).AddMinutes(30)
          $deployment = $null
          $seenLogs = @{}
          do {
              Start-Sleep -Seconds 10
              try {
                  $deployment = Invoke-RestMethod -Uri $statusUrl -Headers $headers -TimeoutSec 60
                  Write-Host "Deploy: status=$($deployment.status) ($($deployment.status_text)) complete=$($deployment.complete)"
                  
                  if ($deployment.id) {
                      try {
                          $logUrl = "$kuduBase/api/deployments/$($deployment.id)/log"
                          $logs = Invoke-RestMethod -Uri $logUrl -Headers $headers -TimeoutSec 20
                          foreach ($entry in $logs) {
                              $key = "$($entry.id)-$($entry.message)"
                              if (-not $seenLogs.ContainsKey($key)) {
                                  $seenLogs[$key] = $true
                                  Write-Host "  > [KUDU] $($entry.message)"
                              }
                          }
                      } catch {}
                  }
              } catch {
                  Write-Host "Aguardando status do deploy: $($_.Exception.Message)"
              }
          } until (($deployment -and $deployment.complete) -or (Get-Date) -gt $deadline)

          if (-not ($deployment -and $deployment.complete)) {
              throw "Deploy nao terminou em 30 minutos."
          }
          if ($deployment.status -ne 4) {
              throw "Deploy falhou no servidor (status $($deployment.status)): $($deployment.status_text)"
          }

          Write-Host "Deploy concluido com sucesso."

          Write-Host "Reiniciando processos e aquecendo a aplicacao no Azure..."
          try {
              # Reciclar processo para subir com os novos arquivos atualizados
              Invoke-RestMethod -Uri "$kuduBase/api/processes/0" -Method Delete -Headers $headers -TimeoutSec 30
              Write-Host "Reciclagem do processo disparada."
          } catch {
              Write-Host "Processo ja estava reiniciando: $($_.Exception.Message)"
          }

          Write-Host "Aguardando 15s para o runner subir os servicos..."
          Start-Sleep -Seconds 15

          Write-Host "Aquecendo site (warm-up)..."
          for ($i = 1; $i -le 6; $i++) {
              try {
                  $siteResp = Invoke-WebRequest -Uri "https://grupoqmax.com.br" -UseBasicParsing -TimeoutSec 15
                  Write-Host "Resposta: HTTP $($siteResp.StatusCode)"
                  if ($siteResp.StatusCode -eq 200) { break }
              } catch {
                  Write-Host "Aguardando site responder ($i/6): $($_.Exception.Message)"
                  Start-Sleep -Seconds 5
              }
          }

      - name: Finalizar
        run: |
          echo "=========================================="
          echo " GRUPO Q-MAX - DEPLOY CONCLUIDO"
          echo "=========================================="
