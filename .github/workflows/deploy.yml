name: Deploy to Azure App Service

on:
  push:
    branches:
      - main

# One deploy at a time: db push and the Kudu zip deploy must not overlap; a newer push waits
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      NODE_VERSION: '22.x'
      KUDU_URL: ${{ secrets.KUDU_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
      PUBLISH_PASS: ${{ secrets.PUBLISH_PASS }}
      MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_ALLOWED_DOMAINS: ${{ secrets.MICROSOFT_ALLOWED_DOMAINS }}
      # Signs the CRM session and /admin cookies (lib/auth.ts); /admin password when none was saved from /admin
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      # E-mails that may get a link to create the /admin password, comma-separated
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      # Integração QXBACK (lib/crm-qxback.ts); secret vazio = variável fora do .env
      QXBACK_TOKEN: ${{ secrets.QXBACK_TOKEN }}
      QXBACK_STAGES: ${{ secrets.QXBACK_STAGES }}
      QXBACK_FIELDS: ${{ secrets.QXBACK_FIELDS }}
      QXBACK_WEBHOOK_URL: ${{ secrets.QXBACK_WEBHOOK_URL }}
      QXBACK_WEBHOOK_SECRET: ${{ secrets.QXBACK_WEBHOOK_SECRET }}
      # Integração QXSign (lib/crm-qxsign.ts); sem QXSIGN_TOKEN a rota recusa tudo
      QXSIGN_TOKEN: ${{ secrets.QXSIGN_TOKEN }}
      QXSIGN_STAGES: ${{ secrets.QXSIGN_STAGES }}
      QXSIGN_WEBHOOK_URL: ${{ secrets.QXSIGN_WEBHOOK_URL }}
      QXSIGN_WEBHOOK_SECRET: ${{ secrets.QXSIGN_WEBHOOK_SECRET }}
      # Eventos (Finora Experience) API/web, read from the same .env by runner.js
      EVENTOS_DATABASE_URL: ${{ secrets.EVENTOS_DATABASE_URL }}
      EVENTOS_JWT_SECRET: ${{ secrets.EVENTOS_JWT_SECRET }}
      EVENTOS_CPF_HASH_SECRET: ${{ secrets.EVENTOS_CPF_HASH_SECRET }}
      EVENTOS_DATA_ENCRYPTION_KEY: ${{ secrets.EVENTOS_DATA_ENCRYPTION_KEY }}
      FINORA_ADMIN_API_KEY: ${{ secrets.FINORA_ADMIN_API_KEY }}
      FINORA_ADMIN_SESSION_TOKEN: ${{ secrets.FINORA_ADMIN_SESSION_TOKEN }}
      # Controle de Fechamento (PHP App Service URL)
      FECHAMENTO_URL: ${{ secrets.FECHAMENTO_URL }}
      # WhatsApp Z-API credentials
      ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
      ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
      ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
      DISABLE_WHATSAPP: ${{ secrets.DISABLE_WHATSAPP }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            eventos/package-lock.json
            proposta/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          cd eventos && (npm ci || npm install --prefer-offline --no-audit) && cd ..
          cd proposta && (npm ci || npm install --prefer-offline --no-audit) && cd ..

      - name: Generate Prisma Client
        run: |
          npx prisma generate
          npx prisma generate --schema=eventos/apps/api/prisma/schema.prisma

      # Before touching the production database
      - name: Testes (node:test)
        run: npm test

      - name: Cache PHP CLI Standalone
        id: cache-php
        uses: actions/cache@v4
        with:
          path: /tmp/php-cli
          key: php-cli-8.3.32-linux-x86_64



      - name: Sincronizar Banco de Dados (DB Push)
        continue-on-error: true
        run: npx prisma db push --skip-generate

      - name: Seed Sócios no Banco de Dados
        continue-on-error: true
        run: node scripts/seed-prod-team.cjs

      - name: Robô de Testes Automatizados
        continue-on-error: true
        run: node test-db.js

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .qmax-next/cache
            eventos/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'eventos/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'eventos/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js
        run: |
          npm run build
          cd eventos && npm run build && cd ..

      - name: Montar pacote standalone
        run: |
          set -e
          echo "=========================================="
          echo " MONTANDO PACOTE STANDALONE Q-MAX + EVENTOS"
          echo "=========================================="

          rm -rf deploy
          rm -f site.zip
          mkdir -p deploy

          echo ""
          echo "1. Copiando standalone..."
          cp -R .qmax-next/standalone/. deploy/
          # Remover pastas rastreadas duplicadas para reduzir o tamanho do ZIP
          rm -rf deploy/eventos deploy/Grupo-Q-Max deploy/backup-* deploy/tests

          echo ""
          echo "2. Copiando PUBLIC..."
          mkdir -p deploy/public
          cp -R public/. deploy/public/

          echo ""
          echo "3. Copiando static do Next..."
          mkdir -p deploy/.qmax-next
          if [ -d ".qmax-next/static" ]; then
            cp -R .qmax-next/static deploy/.qmax-next/static
          fi

          echo ""
          echo "3.1. Copiando DATA (uploads e team)..."
          mkdir -p deploy/data/uploads
          mkdir -p deploy/public/team
          if [ -d "data" ]; then
            cp -R data/. deploy/data/
          fi
          if [ -d "public/team" ]; then
            cp -R public/team/. deploy/public/team/
          fi

          echo ""
          echo "3.2. Criando .env para o servidor..."
          echo "DATABASE_URL=${DATABASE_URL}" > deploy/.env
          echo "MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}" >> deploy/.env
          echo "MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}" >> deploy/.env
          echo "MICROSOFT_ALLOWED_DOMAINS=${MICROSOFT_ALLOWED_DOMAINS}" >> deploy/.env
          if [ -n "${DISABLE_WHATSAPP}" ]; then
            echo "DISABLE_WHATSAPP='${DISABLE_WHATSAPP}'" >> deploy/.env
          else
            echo "DISABLE_WHATSAPP='false'" >> deploy/.env
          fi
          # Aspas simples: QXBACK_STAGES/QXBACK_FIELDS são JSON; secret vazio = variável fora do .env (node --env-file)
          for name in AUTH_SECRET ADMIN_PASSWORD ADMIN_EMAILS QXBACK_TOKEN QXBACK_STAGES QXBACK_FIELDS QXBACK_WEBHOOK_URL QXBACK_WEBHOOK_SECRET \
            QXSIGN_TOKEN QXSIGN_STAGES QXSIGN_WEBHOOK_URL QXSIGN_WEBHOOK_SECRET \
            EVENTOS_DATABASE_URL EVENTOS_JWT_SECRET EVENTOS_CPF_HASH_SECRET EVENTOS_DATA_ENCRYPTION_KEY FINORA_ADMIN_API_KEY FINORA_ADMIN_SESSION_TOKEN \
