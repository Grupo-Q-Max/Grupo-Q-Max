trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: 'CI-CD credenciais'
- name: NODE_VERSION
  value: '22.x'
- name: KUDU_URL
  value: 'https://webbd01-app-gybye4gucffsf4fq.scm.brazilsouth-01.azurewebsites.net'

steps:

- task: UseNode@1
  displayName: 'Usar Node.js 22'
  inputs:
    version: '$(NODE_VERSION)'

- script: npm ci
  displayName: 'Instalar dependencias'

- script: npm run build
  displayName: 'Build Next.js'

- bash: |
    set -e

    echo "Validando standalone..."

    if [ ! -f ".qmax-next/standalone/server.js" ]; then
      echo "ERRO: server.js standalone nao encontrado."
      exit 1
    fi

    echo "Standalone OK."
  displayName: 'Validar standalone'

- bash: |
    set -e

    echo "Preparando pacote Q-Max..."

    rm -rf deploy
    rm -f site.zip

    mkdir -p deploy

    cp -R .qmax-next/standalone/. deploy/

    if [ -d "public" ]; then
      cp -R public deploy/public
    fi

    mkdir -p deploy/.qmax-next

    if [ -d ".qmax-next/static" ]; then
      cp -R .qmax-next/static deploy/.qmax-next/static
    fi

    node -e "
      const fs = require('fs');
      const p = './deploy/package.json';
      const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
      pkg.scripts = pkg.scripts || {};
      pkg.scripts.start = 'node server.js';
      fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
    "

    echo ""
    echo "package.json de producao:"
    cat deploy/package.json

    echo ""
    echo "Arquivos principais:"
    ls -la deploy

    cd deploy
    zip -r ../site.zip .
    cd ..

    echo ""
    echo "Pacote:"
    ls -lh site.zip
  displayName: 'Montar pacote standalone'

- task: PowerShell@2
  displayName: 'Diagnostico das credenciais'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $user = $env:PUBLISH_USER
      $pass = $env:PUBLISH_PASS

      if ([string]::IsNullOrWhiteSpace($user)) {
          throw "PUBLISH_USER vazio."
      }

      if ([string]::IsNullOrWhiteSpace($pass)) {
          throw "PUBLISH_PASS vazio."
      }

      Write-Host "PUBLISH_USER carregado."
      Write-Host "Tamanho USER: $($user.Length)"
      Write-Host "Tamanho PASS: $($pass.Length)"

      if ($user -eq '$webbd01-app') {
          Write-Host "USER EXATO: OK"
      }
      else {
          throw "PUBLISH_USER inesperado."
      }
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)

- task: PowerShell@2
  displayName: 'Deploy Azure App Service'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"

      $username = $env:PUBLISH_USER
      $password = $env:PUBLISH_PASS
      $kuduBase = "$(KUDU_URL)"
      $zipPath = "$(Build.SourcesDirectory)/site.zip"

      if (!(Test-Path $zipPath)) {
          throw "site.zip nao encontrado."
      }

      $pair = "${username}:${password}"

      $base64 = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes($pair)
      )

      $headers = @{
          Authorization = "Basic $base64"
      }

      $url = "$kuduBase/api/publish?type=zip&clean=true&restart=true"

      Write-Host "Publicando Grupo Q-Max..."

      $response = Invoke-WebRequest `
          -Uri $url `
          -Method Post `
          -Headers $headers `
          -InFile $zipPath `
          -ContentType "application/zip" `
          -UseBasicParsing `
          -TimeoutSec 900

      Write-Host "Status HTTP: $($response.StatusCode)"

      if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
          throw "Deploy falhou com HTTP $($response.StatusCode)"
      }

      Write-Host "Deploy concluido com sucesso."
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)

- script: |
    echo "=========================================="
    echo " GRUPO Q-MAX - DEPLOY CONCLUIDO"
    echo "=========================================="
  displayName: 'Finalizar'