# Automatic deploy runs on GitHub Actions (.github/workflows/deploy.yml); this pipeline runs only when started by hand
trigger: none
pr: none
 
pool:
  vmImage: 'ubuntu-latest'
 
variables:
- group: 'CI-CD credenciais'
- name: NODE_VERSION
  value: '22.x'
- name: KUDU_URL
  value: 'https://webbd01-app-gybye4gucffsf4fq.scm.brazilsouth-01.azurewebsites.net'
 
steps:
 
- task: UseNode@1
  displayName: 'Usar Node.js 22'
  inputs:
    version: '$(NODE_VERSION)'
 
- script: |
    npm ci
    cd eventos && (npm ci || npm install --prefer-offline --no-audit) && cd ..
  displayName: 'Instalar dependencias'
 
- script: |
    npx prisma generate
    npx prisma generate --schema=eventos/apps/api/prisma/schema.prisma
  displayName: 'Gerar Prisma Client'
 
- script: npx prisma db push
  displayName: 'Sincronizar Banco de Dados (DB Push)'
  env:
    DATABASE_URL: $(DATABASE_URL)
 
- script: node scripts/seed-prod-team.cjs
  displayName: 'Seed Sócios no Banco de Dados'
  env:
    DATABASE_URL: $(DATABASE_URL)

- script: node test-db.js
  displayName: 'Robô de Testes Automatizados'
  env:
    DATABASE_URL: $(DATABASE_URL)
 
- script: |
    npm run build
    cd eventos && npm run build && cd ..
  displayName: 'Build Next.js e Eventos'
 
- bash: |
    set -e
 
    echo "=========================================="
    echo " MONTANDO PACOTE STANDALONE Q-MAX + EVENTOS"
    echo "=========================================="
 
    rm -rf deploy
    rm -f site.zip
 
    mkdir -p deploy
 
    echo ""
    echo "1. Copiando standalone..."
    cp -R .qmax-next/standalone/. deploy/
 
    echo ""
    echo "2. Copiando PUBLIC..."
    mkdir -p deploy/public
    cp -R public/. deploy/public/
 
    echo ""
    echo "3. Copiando static do Next..."
    mkdir -p deploy/.qmax-next
 
    if [ -d ".qmax-next/static" ]; then
      cp -R .qmax-next/static deploy/.qmax-next/static
    fi
 
    echo ""
    echo "3.1. Copiando DATA (uploads e team)..."
    mkdir -p deploy/data/uploads
    mkdir -p deploy/public/team
    if [ -d "data" ]; then
      cp -R data/. deploy/data/
    fi
    if [ -d "public/team" ]; then
      cp -R public/team/. deploy/public/team/
    fi
 
    echo ""
    echo "3.2. Criando .env para o servidor..."
    # Azure keeps an undefined $(VAR) as literal text: treat it as unset
    defined() { case "$1" in ""|'$('*) return 1;; esac; }
    defined "${DATABASE_URL}" || { echo "DATABASE_URL nao definido no grupo CI-CD credenciais"; exit 1; }
    echo "DATABASE_URL=${DATABASE_URL}" > deploy/.env
    echo "MICROSOFT_TENANT_ID=e3a65ea4-591b-4eab-acf5-059083274f98" >> deploy/.env
    echo "MICROSOFT_CLIENT_ID=365625d9-2647-489d-b319-48b960f9edab" >> deploy/.env
    echo "MICROSOFT_ALLOWED_DOMAINS=grupoqmax.com.br" >> deploy/.env
    echo "DISABLE_WHATSAPP='true'" >> deploy/.env
    if defined "${AUTH_SECRET}"; then echo "AUTH_SECRET=${AUTH_SECRET}" >> deploy/.env; fi
    if defined "${ADMIN_PASSWORD}"; then echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}" >> deploy/.env; fi
    # Eventos (Finora Experience) secrets from the CI-CD credenciais group
    for name in EVENTOS_DATABASE_URL EVENTOS_JWT_SECRET EVENTOS_CPF_HASH_SECRET EVENTOS_DATA_ENCRYPTION_KEY FINORA_ADMIN_API_KEY FINORA_ADMIN_SESSION_TOKEN; do
      if defined "${!name}"; then echo "${name}='${!name}'" >> deploy/.env; fi
    done

    echo ""
    echo "3.3. Copiando Runner e empacotando Eventos..."
    cp runner.js deploy/runner.js

    echo "Configurando Eventos API..."
    mkdir -p deploy/eventos-api
    cp -R eventos/apps/api/dist deploy/eventos-api/dist
    if [ -d "eventos/apps/api/prisma" ]; then
      cp -R eventos/apps/api/prisma deploy/eventos-api/prisma
    fi
    cp eventos/apps/api/package.json deploy/eventos-api/package.json
    (cd deploy/eventos-api && npm install --omit=dev --prefer-offline --no-audit --no-fund)

    echo "Configurando Eventos Web..."
    mkdir -p deploy/eventos-web
    cp -R eventos/apps/web/.next/standalone/. deploy/eventos-web/
    mkdir -p deploy/eventos-web/apps/web/.next
    cp -R eventos/apps/web/.next/static deploy/eventos-web/apps/web/.next/static
    if [ -d "eventos/apps/web/public" ]; then
      mkdir -p deploy/eventos-web/apps/web/public
      cp -R eventos/apps/web/public/. deploy/eventos-web/apps/web/public/
    fi

    echo ""
    echo "4. Validando logos obrigatorias..."
 
    test -f deploy/public/brands/brand-auditoria.png
    test -f deploy/public/brands/brand-contabil.png
    test -f deploy/public/brands/brand-talents.png
    test -f deploy/public/brands/brand-technology.png
    test -f deploy/public/brands/brand-lagerhaus.png
 
    echo "Todas as logos principais estao no pacote."
 
    echo ""
    echo "5. Assets encontrados:"
    find deploy/public/brands -maxdepth 1 -type f -print | sort
 
    echo ""
    echo "6. Configurando start..."
 
    node -e "
      const fs = require('fs');
      const p = './deploy/package.json';
      const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
      pkg.scripts = pkg.scripts || {};
      pkg.scripts.start = 'node --env-file=.env runner.js';
      fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
    "
 
    echo ""
    echo "7. Criando ZIP..."
 
    cd deploy
    zip -r ../site.zip .
    cd ..
 
    echo ""
    echo "8. Validando ZIP..."
 
    unzip -l site.zip | grep "public/brands/brand-auditoria.png"
    unzip -l site.zip | grep "public/brands/brand-contabil.png"
    unzip -l site.zip | grep "public/brands/brand-talents.png"
    unzip -l site.zip | grep "public/brands/brand-technology.png"
    unzip -l site.zip | grep "public/brands/brand-lagerhaus.png"
    unzip -l site.zip | grep "runner.js"
    unzip -l site.zip | grep "eventos-api/dist/src/main.js"
    unzip -l site.zip | grep "eventos-web/apps/web/server.js"
 
    echo ""
    echo "PACOTE VALIDADO COM SUCESSO."
    ls -lh site.zip
 
  displayName: 'Montar pacote standalone'
  env:
    DATABASE_URL: $(DATABASE_URL)
    AUTH_SECRET: $(AUTH_SECRET)
    ADMIN_PASSWORD: $(ADMIN_PASSWORD)
    EVENTOS_DATABASE_URL: $(EVENTOS_DATABASE_URL)
    EVENTOS_JWT_SECRET: $(EVENTOS_JWT_SECRET)
    EVENTOS_CPF_HASH_SECRET: $(EVENTOS_CPF_HASH_SECRET)
    EVENTOS_DATA_ENCRYPTION_KEY: $(EVENTOS_DATA_ENCRYPTION_KEY)
    FINORA_ADMIN_API_KEY: $(FINORA_ADMIN_API_KEY)
    FINORA_ADMIN_SESSION_TOKEN: $(FINORA_ADMIN_SESSION_TOKEN)

- task: PowerShell@2
  displayName: 'Diagnostico das credenciais'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $user = $env:PUBLISH_USER
      $pass = $env:PUBLISH_PASS
 
      if ([string]::IsNullOrWhiteSpace($user)) {
          throw "PUBLISH_USER vazio."
      }
 
      if ([string]::IsNullOrWhiteSpace($pass)) {
          throw "PUBLISH_PASS vazio."
      }
 
      Write-Host "PUBLISH_USER carregado."
      Write-Host "Tamanho USER: $($user.Length)"
      Write-Host "Tamanho PASS: $($pass.Length)"
 
      if ($user -eq '$webbd01-app') {
          Write-Host "USER EXATO: OK"
      }
      else {
          throw "PUBLISH_USER inesperado."
      }
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)
 
- task: PowerShell@2
  displayName: 'Deploy Azure App Service'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
 
      $username = $env:PUBLISH_USER
      $password = $env:PUBLISH_PASS
      $kuduBase = "$(KUDU_URL)"
      $zipPath = "$(Build.SourcesDirectory)/site.zip"
 
      if (!(Test-Path $zipPath)) {
          throw "site.zip nao encontrado."
      }
 
      $pair = "${username}:${password}"
 
      $base64 = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes($pair)
      )
 
      $headers = @{
          Authorization = "Basic $base64"
      }
 
      # Async (see .github/workflows/deploy.yml): the synchronous call hit the 504 gateway timeout
      $url = "$kuduBase/api/publish?type=zip&clean=true&restart=true&async=true"
 
      Write-Host "Publicando Grupo Q-Max..."
 
      $response = Invoke-WebRequest `
          -Uri $url `
          -Method Post `
          -Headers $headers `
          -InFile $zipPath `
          -ContentType "application/zip" `
          -UseBasicParsing `
          -TimeoutSec 900
 
      Write-Host "Status HTTP: $($response.StatusCode)"
 
      if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
          throw "Deploy falhou com HTTP $($response.StatusCode)"
      }

      # Kudu DeployStatus: 3 = Failed, 4 = Success
      $statusUrl = "$($response.Headers.Location)"
      if ([string]::IsNullOrWhiteSpace($statusUrl)) { $statusUrl = "$kuduBase/api/deployments/latest" }
      $deadline = (Get-Date).AddMinutes(30)
      $deployment = $null
      do {
          Start-Sleep -Seconds 15
          try {
              $deployment = Invoke-RestMethod -Uri $statusUrl -Headers $headers -TimeoutSec 60
              Write-Host "Deploy: status=$($deployment.status) $($deployment.status_text) complete=$($deployment.complete)"
          } catch {
              Write-Host "Status do deploy indisponivel: $($_.Exception.Message)"
          }
      } until (($deployment -and $deployment.complete) -or (Get-Date) -gt $deadline)

      if (-not ($deployment -and $deployment.complete)) {
          throw "Deploy nao terminou em 30 minutos."
      }
      if ($deployment.status -ne 4) {
          throw "Deploy falhou no servidor (status $($deployment.status)): $($deployment.status_text)"
      }

      Write-Host "Deploy concluido com sucesso."
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)
 
- script: |
    echo "=========================================="
    echo " GRUPO Q-MAX - DEPLOY CONCLUIDO"
    echo "=========================================="
  displayName: 'Finalizar'
 