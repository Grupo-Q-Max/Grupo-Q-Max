- task: PowerShell@2
  displayName: 'Diagnostico das credenciais'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $user = $env:PUBLISH_USER
      $pass = $env:PUBLISH_PASS
 
      if ([string]::IsNullOrWhiteSpace($user)) {
          throw "PUBLISH_USER vazio."
      }
 
      if ([string]::IsNullOrWhiteSpace($pass)) {
          throw "PUBLISH_PASS vazio."
      }
 
      Write-Host "PUBLISH_USER carregado."
      Write-Host "Tamanho USER: $($user.Length)"
      Write-Host "Tamanho PASS: $($pass.Length)"
 
      if ($user -eq '$webbd01-app') {
          Write-Host "USER EXATO: OK"
      }
      else {
          throw "PUBLISH_USER inesperado."
      }
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)
 
- task: PowerShell@2
  displayName: 'Deploy Azure App Service'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
 
      $username = $env:PUBLISH_USER
      $password = $env:PUBLISH_PASS
      $kuduBase = "$(KUDU_URL)"
      $zipPath = "$(Build.SourcesDirectory)/site.zip"
 
      if (!(Test-Path $zipPath)) {
          throw "site.zip nao encontrado."
      }
 
      $pair = "${username}:${password}"
 
      $base64 = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes($pair)
      )
 
      $headers = @{
          Authorization = "Basic $base64"
      }
 
      # Async: O endpoint oficial do Kudu para deploy assincrono via ZIP e /api/zipdeploy?isAsync=true.
      # Ele aceita o upload do ZIP e retorna HTTP 202 imediatamente com o header Location para acompanhamento,
      # evitando qualquer timeout (504 GatewayTimeout) do proxy do Azure App Service.
      $url = "$kuduBase/api/zipdeploy?isAsync=true"
 
      Write-Host "Publicando Grupo Q-Max via Kudu ZipDeploy (async)..."
 
      $response = Invoke-WebRequest `
          -Uri $url `
          -Method Post `
          -Headers $headers `
          -InFile $zipPath `
          -ContentType "application/zip" `
          -UseBasicParsing `
          -TimeoutSec 900
 
      Write-Host "Status HTTP inicial: $($response.StatusCode)"
 
      if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
          throw "Deploy falhou com HTTP $($response.StatusCode)"
      }
 
      # Acompanhar o deploy assincrono pelo endpoint de status
      # Kudu DeployStatus: 0 = Pending, 1 = Building, 2 = Deploying, 3 = Failed, 4 = Success
      $statusUrl = "$($response.Headers.Location)"
      if ([string]::IsNullOrWhiteSpace($statusUrl)) {
          $statusUrl = "$kuduBase/api/deployments/latest"
      } elseif (-not $statusUrl.StartsWith("http")) {
          $statusUrl = "$kuduBase$statusUrl"
      }
      Write-Host "URL de monitoramento do deploy: $statusUrl"

      $deadline = (Get-Date).AddMinutes(30)
      $deployment = $null
      do {
          Start-Sleep -Seconds 10
          try {
              $deployment = Invoke-RestMethod -Uri $statusUrl -Headers $headers -TimeoutSec 60
              Write-Host "Deploy: status=$($deployment.status) ($($deployment.status_text)) complete=$($deployment.complete)"
          } catch {
              Write-Host "Aguardando status do deploy: $($_.Exception.Message)"
          }
      } until (($deployment -and $deployment.complete) -or (Get-Date) -gt $deadline)

      if (-not ($deployment -and $deployment.complete)) {
          throw "Deploy nao terminou em 30 minutos."
      }
      if ($deployment.status -ne 4) {
          throw "Deploy falhou no servidor (status $($deployment.status)): $($deployment.status_text)"
      }

      Write-Host "Deploy concluido com sucesso."
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)
 
