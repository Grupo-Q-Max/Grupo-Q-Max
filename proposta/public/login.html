<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Q-MAX Propostas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/qmax-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
    <link rel="stylesheet" href="css/tema-escritorio.css">
</head>

<body class="page-login theme-finora">
    <main class="login-shell">
        <section class="login-brand-panel">
            <span class="eyebrow">Plataforma comercial</span>
            <h1>Q-MAX Propostas</h1>
            <p>Gerencie propostas FINORA, Q-MAX Contábil e Q-MAX Tech em um painel único, seguro e profissional.</p>
            <div class="login-highlights">
                <span>FINORA</span>
                <span>CONTÁBIL</span>
                <span>TECH</span>
            </div>
        </section>

        <section class="card login-card glass-card">
            <div class="logo-container">
                <div class="login-mark">Q</div>
                <h2>Acesso Restrito</h2>
                <p>Entre com seu usuário institucional.</p>
            </div>

            <div class="card-body" style="padding: 0;">
                <form id="loginForm">
                    <div class="input-group">
                        <label for="email">E-mail Institucional</label>
                        <input type="email" id="email" placeholder="seuemail@grupoqmax.com.br" required>
                    </div>
                    <div class="input-group" style="margin-top: 16px;">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary btn-login" style="margin-top: 24px;">Entrar no
                        Painel</button>
                </form>
                <div id="loginErro"></div>
            </div>
        </section>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = e.target.querySelector('button');

            btn.innerText = 'Autenticando...';
            btn.disabled = true;
            document.getElementById('loginErro').innerText = '';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('finora_token', data.token);
                    localStorage.setItem('finora_role', data.role);
                    localStorage.setItem('finora_nome', data.nome);
                    window.location.href = '/proposta/index.html';
                } else {
                    document.getElementById('loginErro').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('loginErro').innerText = 'Erro de conexão com o servidor.';
            } finally {
                btn.innerText = 'Entrar no Painel';
                btn.disabled = false;
            }
        });
    </script>
    <script src="js/qmax-theme.js"></script>
</body>

</html>
