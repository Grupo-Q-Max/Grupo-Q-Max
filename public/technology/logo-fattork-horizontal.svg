<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="350" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#aaaaaa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B15D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a36ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left Symbol/Icon -->
  <g transform="translate(10, 20)">
    <!-- Main F shape -->
    <path d="M10,0 L45,0 L45,15 L25,15 L25,25 L40,25 L40,40 L25,40 L25,60 L10,60 Z" fill="url(#grad)" />
    <!-- Modern accent triangle -->
    <polygon points="50,0 65,0 50,15" fill="url(#accent)" />
    <!-- Lower accent -->
    <polygon points="45,25 60,25 45,40" fill="url(#accent)" />
  </g>

  <!-- FATTORK Text -->
  <text x="90" y="62" font-family="'Inter', 'Segoe UI', 'Roboto', sans-serif" font-weight="800" font-size="48" fill="#ffffff" letter-spacing="2">FATTOR K</text>
</svg>
