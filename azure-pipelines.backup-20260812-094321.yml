trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'
  KUDU_URL: 'https://webbd01-app-gybye4gucffsf4fq.scm.brazilsouth-01.azurewebsites.net'

steps:

# ============================================================
# 1. NODE
# ============================================================

- task: NodeTool@0
  displayName: 'Usar Node.js 20'
  inputs:
    versionSpec: '$(NODE_VERSION)'

# ============================================================
# 2. DEPENDENCIAS
# ============================================================

- script: |
    npm ci
  displayName: 'Instalar dependencias'

# ============================================================
# 3. BUILD NEXT.JS
# ============================================================

- script: |
    npm run build
  displayName: 'Build Next.js'

# ============================================================
# 4. VALIDAR STANDALONE
# ============================================================

- bash: |
    set -e

    echo "Validando build standalone..."

    if [ ! -f ".qmax-next/standalone/server.js" ]; then
      echo "ERRO: .qmax-next/standalone/server.js nao encontrado"
      exit 1
    fi

    echo "Standalone OK"
  displayName: 'Validar standalone'

# ============================================================
# 5. MONTAR PACOTE DE PRODUCAO
# ============================================================

- bash: |
    set -e

    echo "Preparando pacote..."

    rm -rf deploy
    rm -f site.zip

    mkdir -p deploy

    cp -R .qmax-next/standalone/. deploy/

    if [ -d "public" ]; then
      cp -R public deploy/public
    fi

    mkdir -p deploy/.qmax-next

    if [ -d ".qmax-next/static" ]; then
      cp -R .qmax-next/static deploy/.qmax-next/static
    fi

    echo ""
    echo "Conteudo do pacote:"
    ls -la deploy

    echo ""
    echo "Compactando..."

    cd deploy
    zip -r ../site.zip .
    cd ..

    echo ""
    echo "Pacote criado:"
    ls -lh site.zip
  displayName: 'Montar pacote standalone'

# ============================================================
# 6. DEPLOY VIA KUDU ZIPDEPLOY
# ============================================================

- task: PowerShell@2
  displayName: 'Deploy Azure App Service'
  inputs:
    pwsh: true
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"

      $username = $env:PUBLISH_USER
      $password = $env:PUBLISH_PASS
      $kuduBase = "$(KUDU_URL)"

      if ([string]::IsNullOrWhiteSpace($username)) {
          throw "PUBLISH_USER nao configurado."
      }

      if ([string]::IsNullOrWhiteSpace($password)) {
          throw "PUBLISH_PASS nao configurado."
      }

      $zipPath = "$(Build.SourcesDirectory)/site.zip"

      if (!(Test-Path $zipPath)) {
          throw "site.zip nao encontrado."
      }

      $pair = "${username}:${password}"

      $base64 = [Convert]::ToBase64String(
          [Text.Encoding]::ASCII.GetBytes($pair)
      )

      $headers = @{
          Authorization = "Basic $base64"
      }

      $url = "$kuduBase/api/zipdeploy"

      Write-Host "Iniciando deploy..."
      Write-Host "Destino: webbd01-app"

      $response = Invoke-WebRequest `
          -Uri $url `
          -Method Post `
          -Headers $headers `
          -InFile $zipPath `
          -ContentType "application/zip" `
          -UseBasicParsing `
          -TimeoutSec 900

      Write-Host ""
      Write-Host "Status HTTP: $($response.StatusCode)"
      Write-Host "Deploy enviado com sucesso."

      if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
          throw "Deploy retornou HTTP $($response.StatusCode)"
      }
  env:
    PUBLISH_USER: $(PUBLISH_USER)
    PUBLISH_PASS: $(PUBLISH_PASS)

# ============================================================
# 7. FINAL
# ============================================================

- script: |
    echo "=========================================="
    echo " Q-MAX DEPLOY FINALIZADO"
    echo "=========================================="
  displayName: 'Finalizar'